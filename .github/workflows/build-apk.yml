name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies and add Android platform
        run: |
          npm install
          npx cap add android --no-interactive
          npx cap sync android

      - name: Grant microphone permission in AndroidManifest.xml
        run: |
          python3 -c '
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()
          perm = "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />"
          if perm not in txt:
              txt = txt.replace("<manifest ", "<manifest ", 1)
              txt = txt.replace("<application", perm + "\n    <application", 1)
              p.write_text(txt)
          '

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-lookup-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
